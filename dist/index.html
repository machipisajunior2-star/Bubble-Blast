<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:description" content="Bubble Blast is a fast-paced, arcade-style web game where your reflexes are your only defense." />
    <meta property="og:image" content="https://github.com/user-attachments/assets/67da350b-f28a-4a5d-895b-d9ab7eee8007" />
    <title>Bubble-Blast</title>
<script defer src="main.js"></script></head>
<body>
  <div class="audio-btn-con">
      <button id="audio-btn"><img id="volume-icon" src="" alt="mute icon" /></button>
    </div>
    <section id="home-ui">
        <div class="welcome-info">
            <h1 class="game-title">Bubble Shooter</h1>
            <div class="instructions">
                <p>This is a fun game, where you try to pop bubbles before they reach the wall and if they do the game ends </p>
                <strong>Instructions:</strong>
                <ul>
                    <li>&#11014; - <span>To move canon up</span></li>
                    <li>&#11015; - <span>To move canon down</span></li>
                    <li>&#9251; - <span>To shoot canon</span></li>
                </ul>
            </div>
            <button id="play-btn">&#x1F579; Play</button>
        </div>
        <canvas id="animation"></canvas>
        <audio id="theme-audio" src="" muted="true" loop></audio>
    </section>
    <section id="end-game-ui">
        <div class="result-div">
            <span>&#128081;</span>
            <strong>
                score:
            </strong>
            <h1 id="result"></h1>
        </div>
        <div class="nav-btn">
            <button id="home-btn"><img id="home-icon" src="" alt="home button"></button>
            <button id="play-again">Play Again</button>
        </div>
        <audio id="game-over-audio" src="" muted="true"></audio>
    </section>
    <section id="game-ux">
        <div class="score-div">
            <span>
                Score: 
            </span>
            <span id="score">
            </span>
        </div>
        <button id="pause-btn">&#x23f8;</button>
        <div id="controls">
            <button id="continue-btn">Continue</button>
            <button id="restart-btn">Restart</button>
            <button id="quit-btn">Quit</button>
        </div>
        <canvas id="canvas">
        </canvas>
        <audio id="game-start-audio" src="" muted="true"></audio>
        <audio id="shoot-audio" src="" muted="true"></audio>
        <audio id ="bubble-shrink-audio" src="" muted="true"></audio>
        <audio id="bubble-pop-audio" src="" muted="true"></audio>
    </section>
</body>
</html>
